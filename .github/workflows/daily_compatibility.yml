name: Daily Compatibility Tests

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  compatibility:
    runs-on: ubuntu-latest
    outputs:
      tested_version: ${{ steps.home_assistant_version.outputs.version }}
    strategy:
      matrix:
        python-version: ["3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
      - name: Upgrade Home Assistant and test plugin
        run: pip install --upgrade homeassistant pytest-homeassistant-custom-component
      - name: Capture tested Home Assistant version
        id: home_assistant_version
        run: echo "version=$(python -c 'from importlib.metadata import version; print(version("homeassistant"))')" >> "$GITHUB_OUTPUT"

      - name: Run compatibility validation suite
        run: |
          python -m compileall custom_components tests
          python -m pytest tests/unit/test_models.py tests/unit/test_storage_migrations.py tests/unit/test_storage.py tests/unit/test_manager.py tests/unit/test_config_flow_helpers.py tests/unit/test_controller_helpers.py tests/component/test_init.py tests/component/test_services.py tests/component/test_issues.py tests/component/test_config_flow.py tests/component/test_controller_runtime.py tests/component/test_alarm_notifications.py tests/component/test_illuminance_behavior.py tests/component/test_delayed_shutoff.py -q

  publish-tested-version:
    if: github.ref == 'refs/heads/main'
    needs: compatibility
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Update tested version badge data
        env:
          TESTED_VERSION: ${{ needs.compatibility.outputs.tested_version }}
        run: |
          python -c "import json, os; from pathlib import Path; Path('docs/home_assistant_compatibility.json').write_text(json.dumps({'tested_version': os.environ['TESTED_VERSION']}, indent=2) + '\\n')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/home_assistant_compatibility.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: update tested Home Assistant version"
          git pull --rebase origin main
          git push origin main